name: agrinexa-production
services:
  api:
    build:
      context: ../services/api
    image: agrinexa-api:${AGRINEXA_IMAGE_TAG:?set AGRINEXA_IMAGE_TAG}
    restart: unless-stopped
    init: true
    env_file:
      - ../.env.production
    environment:
      AGRINEXA_PRIVATE_PHOTO_DIR: /var/lib/agrinexa/photos
      AGRINEXA_MARKET_SNAPSHOT_PATH: ${AGRINEXA_MARKET_SNAPSHOT_PATH:-}
      AGRINEXA_SCHEME_CATALOGUE_PATH: ${AGRINEXA_SCHEME_CATALOGUE_PATH:-}
    expose:
      - "8000"
    volumes:
      - photo-data:/var/lib/agrinexa/photos
      - type: bind
        source: ${AGRINEXA_APPROVED_DATASET_DIR:?set AGRINEXA_APPROVED_DATASET_DIR}
        target: /var/lib/agrinexa/datasets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ../apps/web
    image: agrinexa-web:${AGRINEXA_IMAGE_TAG:?set AGRINEXA_IMAGE_TAG}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  photo-data:
