services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrinexa
      POSTGRES_USER: agrinexa
      POSTGRES_PASSWORD: ${AGRINEXA_DB_PASSWORD:?set AGRINEXA_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinexa -d agrinexa"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://agrinexa:${AGRINEXA_DB_PASSWORD}@db:5432/agrinexa?sslmode=disable

  web:
    ports: !override
      - "8080:8080"

volumes:
  db-data:
