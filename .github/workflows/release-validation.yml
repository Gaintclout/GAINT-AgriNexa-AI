name: Release validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-non-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  database-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: agrinexa_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrinexa_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Prepare guarded databases
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -c "CREATE DATABASE agrinexa_agent_audit_test"
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -c "COMMENT ON DATABASE agrinexa_test IS 'agrinexa-disposable-live-tests'"
          DATABASE_URL=postgresql+psycopg://postgres:ci-only-password@127.0.0.1:55432/agrinexa_test alembic upgrade 0007_farmer_parcel_ownership
      - name: Guarded PostgreSQL and PostGIS tests
        env:
          AGRINEXA_AGENT_AUDIT_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:55432/agrinexa_agent_audit_test
          AGRINEXA_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:55432/agrinexa_test
        run: pytest -q tests/test_agent_audit_migrations_live.py tests/test_agent_audit_postgres.py tests/test_postgis_integration.py tests/test_scim_claim_concurrency_live.py tests/test_scim_job_live.py tests/test_scim_staged_e2e_live.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agrinexa-api:ci services/api
      - run: docker build -t agrinexa-web:ci apps/web
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production.example -f deploy/compose.production.yml config
